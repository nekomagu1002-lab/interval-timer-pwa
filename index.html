<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07101f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="筋トレ">
    <meta name="description" content="今日のメニュー作成から記録、タイマーまで端末内で完結する筋トレ支援PWA">
    <title>筋トレ支援</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon-180.png">
    <link rel="stylesheet" href="./css/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" type="button" data-route="home" aria-label="ホームへ移動">
          <span class="brand__mark" aria-hidden="true">M</span>
          <span>
            <strong>MY TRAINING</strong>
            <small>LOCAL WORKOUT PWA</small>
          </span>
        </button>
        <p class="topbar__date" id="today-label"></p>
      </header>

      <aside class="desktop-nav" aria-label="メインメニュー">
        <button type="button" data-route="home"><span>⌂</span>HOME</button>
        <button type="button" data-route="today"><span>▤</span>今日のトレーニング</button>
        <button type="button" data-route="history"><span>◷</span>履歴</button>
        <button type="button" data-route="exercises"><span>◆</span>種目</button>
        <button type="button" data-route="equipment"><span>⌁</span>器具</button>
        <button type="button" data-route="timer"><span>◴</span>タイマー</button>
        <button type="button" data-route="settings"><span>⚙</span>設定</button>
      </aside>

      <main class="main-content" id="app-view" tabindex="-1">
        <section class="loading-view" aria-live="polite">
          <span class="loading-view__pulse"></span>
          <p>トレーニングデータを準備しています</p>
        </section>
      </main>

      <section class="session-timer" id="session-timer" hidden aria-live="polite">
        <div>
          <span id="session-timer-label">休憩</span>
          <strong id="session-timer-value">01:00</strong>
        </div>
        <button type="button" data-action="session-timer-toggle">一時停止</button>
        <button type="button" data-action="session-timer-add">+15秒</button>
        <button type="button" data-action="session-timer-skip">スキップ</button>
      </section>

      <nav class="bottom-nav" aria-label="メインメニュー">
        <button type="button" data-route="home"><span>⌂</span>HOME</button>
        <button type="button" data-route="today"><span>▤</span>今日</button>
        <button type="button" data-route="history"><span>◷</span>履歴</button>
        <button type="button" data-route="timer"><span>◴</span>タイマー</button>
        <button type="button" data-route="settings"><span>⚙</span>設定</button>
      </nav>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <input type="file" id="import-file" accept="application/json,.json" hidden>

    <noscript>このアプリを使うにはJavaScriptを有効にしてください。</noscript>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
