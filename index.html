<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Interval">
    <meta name="description" content="筋トレ・ストレッチ・HIIT向けのシンプルなインターバルタイマー">
    <title>Interval Timer</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./assets/icons/icon.svg">
    <link rel="stylesheet" href="./css/styles.css">
  </head>
  <body>
    <main class="app" id="app" data-phase="idle">
      <header class="app__header">
        <p class="eyebrow">TRAINING TIMER</p>
        <h1>Interval</h1>
      </header>

      <section class="timer-card" aria-labelledby="status-label">
        <p class="status" id="status-label" aria-live="polite">待機中</p>
        <p class="time" id="time-display" aria-label="残り時間">00:30</p>
        <p class="set-progress" id="set-display">1 / 3 セット目</p>
      </section>

      <section class="settings" aria-labelledby="settings-title">
        <h2 id="settings-title">設定</h2>

        <div class="setting-row">
          <div>
            <span class="setting-label">運動</span>
            <span class="setting-unit">秒</span>
          </div>
          <div class="stepper">
            <button class="stepper__button" type="button" data-setting="workSeconds" data-delta="-5" aria-label="運動時間を5秒減らす">−</button>
            <output class="stepper__value" id="work-value">30</output>
            <button class="stepper__button" type="button" data-setting="workSeconds" data-delta="5" aria-label="運動時間を5秒増やす">＋</button>
          </div>
        </div>

        <div class="setting-row">
          <div>
            <span class="setting-label">休憩</span>
            <span class="setting-unit">秒</span>
          </div>
          <div class="stepper">
            <button class="stepper__button" type="button" data-setting="restSeconds" data-delta="-5" aria-label="休憩時間を5秒減らす">−</button>
            <output class="stepper__value" id="rest-value">60</output>
            <button class="stepper__button" type="button" data-setting="restSeconds" data-delta="5" aria-label="休憩時間を5秒増やす">＋</button>
          </div>
        </div>

        <div class="setting-row">
          <div>
            <span class="setting-label">セット</span>
            <span class="setting-unit">回</span>
          </div>
          <div class="stepper">
            <button class="stepper__button" type="button" data-setting="sets" data-delta="-1" aria-label="セット数を1減らす">−</button>
            <output class="stepper__value" id="sets-value">3</output>
            <button class="stepper__button" type="button" data-setting="sets" data-delta="1" aria-label="セット数を1増やす">＋</button>
          </div>
        </div>
      </section>

      <details class="sound-settings" id="sound-settings">
        <summary>
          <span>音設定</span>
          <span class="sound-settings__current" id="sound-setting-summary">中・ビープ</span>
        </summary>
        <div class="sound-settings__content">
          <div class="sound-option-group" role="group" aria-labelledby="volume-label">
            <span class="sound-option-group__label" id="volume-label">音量</span>
            <div class="segmented-control segmented-control--four">
              <button type="button" data-sound-setting="volume" data-value="mute">消音</button>
              <button type="button" data-sound-setting="volume" data-value="small">小</button>
              <button type="button" data-sound-setting="volume" data-value="medium">中</button>
              <button type="button" data-sound-setting="volume" data-value="large">大</button>
            </div>
          </div>

          <div class="sound-option-group" role="group" aria-labelledby="tone-label">
            <span class="sound-option-group__label" id="tone-label">音色</span>
            <div class="segmented-control segmented-control--three">
              <button type="button" data-sound-setting="tone" data-value="beep">ビープ</button>
              <button type="button" data-sound-setting="tone" data-value="alarm">アラーム</button>
              <button type="button" data-sound-setting="tone" data-value="bell">ベル</button>
            </div>
          </div>

          <button class="preview-button" id="preview-button" type="button">試聴</button>
          <p class="sound-note">端末本体のメディア音量にも影響されます</p>
        </div>
      </details>

      <section class="controls" aria-label="タイマー操作">
        <button class="button button--primary" id="start-button" type="button">開始</button>
        <button class="button button--secondary" id="pause-button" type="button" disabled>一時停止</button>
        <button class="button button--ghost" id="reset-button" type="button">リセット</button>
      </section>

      <p class="notice" id="wake-lock-notice" aria-live="polite">画面を開いた状態でご利用ください</p>
    </main>

    <noscript>このタイマーを使うにはJavaScriptを有効にしてください。</noscript>
    <script src="./js/app.js" defer></script>
  </body>
</html>
